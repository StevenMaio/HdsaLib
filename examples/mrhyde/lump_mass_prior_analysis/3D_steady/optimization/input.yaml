%YAML 0.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0
    NX: 99
    NY: 99
    NZ: 99
  Physics: 
    modules: thermal
    include advection: false
    Neumann conditions:
      T:
        all boundaries: '-2.0*T'
  Discretization:
    order:
      T: 1
    quadrature: 2
  Parameters input file: input_params.yaml
  Analysis input file: input_rol2.yaml
  Solver:
    workset size: 100
    solver: steady-state
    nonlineam TOL: 1.0e-9
    linear TOL: 1.0e-10
    max nonlinear iters: 4
    max linear iters: 1000
  Postprocess: 
    output file: output_lofi_opt
    response type: pointwise
    compute objective: true
    write solution: true 
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*(T-targ)^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: thermal_source^2
            weight: 5.0
  Functions: 
    thermal source: 100.0*thermal_source
    targ: '50.0-30.0*(x-0.5)^2'
    
...
