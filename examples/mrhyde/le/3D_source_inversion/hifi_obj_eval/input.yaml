%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 0.4
    zmin: 0.0
    zmax: 0.1
    NX: 20
    NY: 10
    NZ: 10
  Physics: 
    modules: thermal, linearelasticity
    alpha_T: 0.0
    Dirichlet conditions:
      T:
        top: 0.0
      dx:
        top: 0.0
        bottom: 0.0
      dy:
        left: 0.2*cos(pi*y/.4)
        right: -0.2*cos(pi*y/.4)
      dz:
        left: 0.2*cos(pi*y/.4)
        right: -0.2*cos(pi*y/.4)
  Discretization:
    order:
      T: 1
      dx: 1
      dy: 1
      dz: 1
    quadrature: 2
  Solver:
    workset size: 100
    solver: steady-state
    linear TOL: 1.0e-12
    max linear iters: 1000
    nonlinear TOL: 1.0e-08
    max nonlinear iters: 10
  Postprocess: 
    output file: output_hifi_1
    response type: pointwise
    compute response: false
    compute objective: true
    write solution: true
  Parameters input file: input_params.yaml
  Analysis input file: input_readExo.yaml
  Functions:
    mu: '8.0'
    lambda: lambdafield 
    thermal source: 100.0 * exp(-50.0 * ( (x-0.5)^2 + (y-0.2)^2 + (z-0.02)^2 ) )
