%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSA
    HDSA:
      Configuration:
        num_prior_samples: 0
        num_posterior_samples: 5
        execute_prior_discrepancy_sampling: true
        execute_posterior_discrepancy_sampling: true
        execute_optimal_solution_update: true
        verbosity: 1
      Prior Computation:
        State Prior: "Bilaplacian"
        use_incomplete_prec: true
      HyperParameters:
        dx:
          beta_u: 1.0E-2
        dy:
          beta_u: 1.0E-2
        dz:
          beta_u: 1.0E-2
        z:
          alpha_z: .1
          beta_z: 1.0E-2
        hessian_num_eig_vals: 10
        hessian_oversampling: 5
      DataLoadParameters:
        OptimalSolutionExoFile: "output_lofi_opt.exo"
        NumHifi: 1
        HifiExoFile1: "output_hifi_1.exo"
...
