%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSA
    HDSA:
      Configuration:
        num_prior_samples: 0
        num_posterior_samples: 0
        execute_prior_discrepancy_sampling: true
        execute_posterior_discrepancy_sampling: true
        execute_optimal_solution_update: true
        verbosity: 1
      Prior Computation:
        State Prior: "Lumped_Mass"
        use_incomplete_prec: true
      HyperParameters:
        dx:
          beta_u: 1.0E-3
        dy:
          beta_u: 1.0E-3
        dz:
          beta_u: 1.0E-3
        z:
          alpha_z: .1
          beta_z: 1.0E-3
        hessian_num_eig_vals: 4
        hessian_oversampling: 0
      DataLoadParameters:
        OptimalSolutionExoFile: "output_lofi_opt.exo"
        NumHifi: 1
        HifiExoFile1: "output_hifi_1.exo"
...
