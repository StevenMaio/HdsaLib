%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 1.0
    NX: 10
    NY: 10
    NZ: 10
  Analysis input file: input_readExo.yaml
  Parameters input file: input_params.yaml
  Physics:
    modules: linearelasticity
    Dirichlet conditions:
      dx:
        left: '0.0'
      dy:
        bottom: '0.0'
      dz:
        back: '0.0'
    Neumann conditions:
      dx:
        right: '-0.2'
      dy:
        top: '-z1 * exp(-100*((x-.35)^2+(z-.35)^2)) - z2 * exp(-100*((x-.7)^2+(z-.35)^2)) - z3 * exp(-100*((x-.35)^2+(z-.7)^2)) - z4 * exp(-100*((x-.7)^2+(z-.7)^2))'
  Functions:
    source dx: '0.0'
    source dy: '0.0'
  Discretization:
    order:
      dx: 1
      dy: 1
      dz: 1
    quadrature: 2
  Solver:
    solver: steady-state
    workset size: 1
    max nonlinear iters: 2
    linear TOL: 1.0e-10
  Postprocess: 
    write solution: true 
    response type: pointwise
    compute objective: true
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*dx^2'
        weight: 1.e4
      Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: '0.0'
            weight: 1.e-2
...
