%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 30.0
    ymin: 0.0
    ymax: 12.0
    zmin: 0.0
    zmax: 3.0
    NX: 90
    NY: 36
    NZ: 9
  Physics: 
    modules: thermal, linearelasticity
    alpha_T: 0.0001
    Dirichlet conditions:
      T:
        top: 0.0
      dx:
        top: 0.0
        bottom: 0.0
      dy:
        left: 4.0*cos(pi*y/12.0)
        right: -4.0*cos(pi*y/12.0)
      dz:
        left: 1.0*cos(pi*y/12.0)
        right: -1.0*cos(pi*y/12.0)
  Discretization:
    order:
      T: 1
      dx: 1
      dy: 1
      dz: 1
    quadrature: 2
  Solver:
    workset size: 100
    solver: steady-state
    linear TOL: 1.0e-12
    max linear iters: 1000
    nonlinear TOL: 1.0e-08
    max nonlinear iters: 10
  Postprocess: 
    output file: output_hifi_1
    response type: pointwise
    compute response: false
    compute objective: true
    write solution: true
  Parameters input file: input_params.yaml
  Analysis input file: input_readExo.yaml
  Functions:
    mu: '8.0'
    lambda: lambdafield 
    thermal source: 100.0 * cos(2.0*pi*x/30.0)^2 * cos(2.0*pi*y/12.0)^2 * exp(-100.0 * ( (z-1.5)^2 ) )
