%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    zmin: 0.0
    zmax: 0.3
    NX: 50
    NY: 50
    NZ: 15
  Analysis:
    analysis type: forward
    have sensor data: false
    save sensor data: true
  Parameters input file: input_params.yaml
  Physics:
    #modules: thermal, linearelasticity
    modules: linearelasticity
    Dirichlet conditions:
      T:
        front: '1000.0*exp(-100*((x-.5)^2+(y-.5)^2))' 
      dx:
        left: '0.0'
        right: '0.0'
      dy:
        left: '0.0'
        right: '0.0'
      dz:
        left: '0.0'
        right: '0.0'
    Neumann conditions:
      dz:
        front: '-exp(-100*((x-.5)^2+(y-.5)^2))' 
  Functions:
    source dx: '0.0'
    source dy: '0.0'
    source dz: '0.0'
    thermal diffusion: '10.0'
    alpha_T: '1.e2'
  Discretization:
    order:
      dx: 1
      dy: 1
      dz: 1
      T: 1
    quadrature: 2
  Solver:
    solver: steady-state
    workset size: 1
    max nonlinear iters: 2
    linear TOL: 1.0e-10
  Postprocess: 
    write solution: true 
...
