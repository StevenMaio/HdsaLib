%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 3
    element type: hex
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 0.4
    zmin: 0.0
    zmax: 0.1
    NX: 20
    NY: 10
    NZ: 10
  Physics: 
    modules: linearelasticity
    Dirichlet conditions:
      dx:
        top: 0.0
        bottom: 0.0
      dy:
        left: 0.2*cos(pi*y/.4)
        right: -0.2*cos(pi*y/.4)
      dz:
        left: 0.2*cos(pi*y/.4)
        right: -0.2*cos(pi*y/.4)
  Discretization:
    order:
      dx: 1
      dy: 1
      dz: 1
    quadrature: 2
  Solver:
    workset size: 50
    solver: steady-state
    linear TOL: 1.0e-12
    max linear iters: 1000
    nonlinear TOL: 1.0e-08
    max nonlinear iters: 10
  Postprocess: 
    response type: pointwise
    compute response: false
    compute objective: true
    write solution: true
    Objective functions:
      val_dx:
        type: sensors
        sensor points file: sensor_points.dat
        save sensor data: true
        sensor data file: sensor_data_dx.dat
        response: 'dx'
        weight: 1.0
      val_dy:
        type: sensors
        sensor points file: sensor_points.dat
        save sensor data: true
        sensor data file: sensor_data_dy.dat
        response: 'dy'
        weight: 1.0
      val_dz:
        type: sensors
        sensor points file: sensor_points.dat
        save sensor data: true
        sensor data file: sensor_data_dz.dat
        response: 'dz'
        weight: 1.0
      regv0:
        type: integrated
        location: volume
        function: 'grad(mufield)[x]*grad(mufield)[x] + grad(mufield)[y]*grad(mufield)[y] + grad(mufield)[z]*grad(mufield)[z]'
        weight: 1.0e-3
      regv1:
        type: integrated
        location: volume
        function: 'grad(lambdafield)[x]*grad(lambdafield)[x] + grad(lambdafield)[y]*grad(lambdafield)[y] + grad(lambdafield)[z]*grad(lambdafield)[z]'
        weight: 1.0e-3
  Parameters input file: input_params.yaml
  Analysis:
    analysis type: forward
  Functions:
    mu: 1 + 0.3 * sin(2.0*pi*x) * sin(2.0*pi*y/0.4) * sin(2.0*pi*z/0.1)
    lambda: 1 + 0.3 * sin(2.0*pi*x) * sin(2.0*pi*y/0.4) * sin(2.0*pi*z/0.1)
