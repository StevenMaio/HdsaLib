%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 2
    element type: quad
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    NX: 20
    NY: 20
  Analysis input file: input_rol2.yaml
  Parameters input file: input_params.yaml
  Physics:
    modules: linearelasticity
    Dirichlet conditions:
      dx:
        left: '0.0'
      dy:
        bottom: '0.0'
    Neumann conditions:
      dx:
        right: '-1.0'
      dy:
        top: '0.0'
  Functions:
    source dx: '100.0 * source_x'
    source dy: '0.0'
  Discretization:
    order:
      dx: 1
      dy: 1
    quadrature: 2
  Solver:
    solver: steady-state
    workset size: 5
    max nonlinear iters: 2
    linear TOL: 1.0e-10
  Postprocess: 
    write solution: true 
    response type: pointwise
    compute objective: true
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*dx^2 + 0.5*dy^2'
        weight: 1.0
      Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: '0.5*source_x^2'
            weight: 1.e-2
...
