%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSA
    HDSA:
      HyperParameters:
        alpha_u: 2000.0
        alpha_z: 0.1
        beta_u: 0.009
        beta_t: 0.028
        beta_z: 0.001
        alpha_d: 0.01
        prior_num_sing_vals: 50
        prior_oversampling: 0
        prior_num_subspace_iter: 1
        hessian_num_eig_vals: 3
        hessian_oversampling: 4
        num_prior_samples: 0
        num_posterior_samples: 1
      DataLoadParameters:
        OptimalSolutionExoFile: "output_lofi_opt.exo"
        OptVariablePhysics: "T"
        NumHifi: 1
        HifiExoFile1: "output_hifi_1.exo"
        LofiExoFile1: "output_lofi_1.exo"
...
