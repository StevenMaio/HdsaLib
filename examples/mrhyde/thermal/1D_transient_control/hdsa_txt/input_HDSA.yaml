%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSA
    HDSA:
      Configuration:
        num_prior_samples: 10
        num_posterior_samples: 0
        execute_prior_discrepancy_sampling: true
        execute_posterior_discrepancy_sampling: true
        execute_optimal_solution_update: true
      HyperParameters:
        T:
          alpha_u: 2000.0
          beta_u: 0.009
          beta_t: 0.028
          alpha_d: 0.01
          prior_num_sing_vals: 50
          prior_oversampling: 0
          prior_num_subspace_iter: 1
        alpha_z: 0.1
        beta_z: 0.001
        hessian_num_eig_vals: 3
        hessian_oversampling: 4
      DataLoadParameters:
        NumHifi: 1
        OptimalSolutionTxtFileU: "u_opt.txt"
        OptimalSolutionTxtFileZ: "z_opt.txt"
        HifiTxtFileU1: "U_Hifi_1.txt"
        LofiTxtFileU1: "U_Lofi_1.txt"
        TxtFileZ1: "Z_1.txt"
        random_number_file: "random_numbers.txt"
        num_random_numbers: 10000000
...
