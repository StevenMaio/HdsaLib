%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSA
    HDSA:
      HyperParameters:
        alpha_u: 0.25
        alpha_z: .111111111
        beta_u: 1.0E-2
        beta_z: 1.0E-3
        alpha_d: 1.0E-5
        prior_num_sing_vals: 200
        prior_oversampling: 0
        prior_num_subspace_iter: 1
        hessian_num_eig_vals: 10
        hessian_oversampling: 10
        num_prior_samples: 0
        num_posterior_samples: 0
      DataLoadParameters:
        OptimalSolutionExoFile: "output_lofi_opt.exo"
        OptVariablePhysics: "T"
        NumHifi: 2
        HifiExoFile1: "output_hifi_1.exo"
        HifiExoFile2: "output_hifi_2.exo"
...
