%YAML 1.1
---
ANONYMOUS:
  Analysis: 
    analysis type: HDSAStoch
    HDSA:
      Configuration:
        num_prior_samples: 10
        num_posterior_samples: 0
        execute_prior_discrepancy_sampling: true
        execute_posterior_discrepancy_sampling: true
        execute_optimal_solution_update: true
      HyperParameters:
        alpha_u: 2000.0
        alpha_z: 0.1
        beta_u: 0.009
        beta_t: 0.028
        beta_z: 0.001
        alpha_d: 0.01
        prior_num_sing_vals: 50
        prior_oversampling: 0
        prior_num_subspace_iter: 1
        hessian_num_eig_vals: 3
        hessian_oversampling: 4
      DataLoadParameters:
        Ensemble Size: 6
        OptimalSolutionExoFile: "output_lofi_opt_sample_"
        OptimalSolutionTxtFileZ: "final_params_.dat"
        StateVariableName: "T"
        NumHifi: 1
        HifiExoFile1: "output_hifi_sample_"
        TxtFileZ1: "final_params_.dat"
        Sample Set File: "sample_set.dat"
        Sample Weight File: "sample_weights.dat"
...
