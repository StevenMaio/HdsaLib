%YAML 1.1
---
ANONYMOUS:
  Parameters: 
    thermal_diff: 
      type: scalar
      value: 1.0
      usage: inactive
    thermal_source_x:
      type: scalar
      value: 1.0
      usage: stochastic
      SOL:
        Distribution:
            Name: Uniform
            Uniform:
              Lower Bound: 0.4 
              Upper Bound: 0.8 
    thermal_source_y:
      type: scalar
      value: 1.0
      usage: stochastic
      SOL:
        Distribution:
            Name: Uniform
            Uniform:
              Lower Bound: 0.4
              Upper Bound: 0.8 
    thermal_boundary_control: 
      type: HGRAD
      order: 1
      usage: discretized
      initial_value: 0.0
...
