%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  verbosity: 0
  Mesh:
    dimension: 1
    element type: interval
    xmin: 0.0
    xmax: 1.0
    NX: 199
  Physics:
    modules: cdr
    #Dirichlet conditions:
    #  c:
    #    all boundaries: '0.0'
  Discretization:
    order:
      c: 1
    quadrature: 2
  Analysis input file: input_rol2.yaml
  Parameters input file: input_params.yaml
  #Analysis:
  #  analysis type: forward
  Solver:
    workset size: 1
    solver: steady-state
    nonlinear TOL: 1.0e-10
    linear TOL: 1.0e-13
    max nonlinear iters: 100
  Postprocess: 
    response type: pointwise
    compute objective: true
    write solution: false
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*(c-targ)^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: source^2
            weight: 0.5E-04
  Functions:
    xvel: xvelval
    #reaction: '(1.0+0.7*sin(2.0*PI*x))*c*c'
    reaction: 'c'
    diffusion: diffval
    source: sourcefield
    targ: '20.0*(x+0.5)*(1.3-x)'  
...
