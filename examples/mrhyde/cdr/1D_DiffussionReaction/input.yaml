%YAML 1.1
---
ANONYMOUS:
  debug level: 0
  Mesh:
    dimension: 1
    element type: interval
    xmin: 0.0
    xmax: 1.0
    NX: 199
  Physics: 
    modules: cdr
    Dirichlet conditions:
      c:
        left: '10.0'
  Discretization:
    order:
      c: 1
    quadrature: 2
  #Parameters input file: input_params.yaml
  #Analysis input file: input_rol2.yaml
  Analysis:
    analysis type: forward
  Solver:
    workset size: 1
    solver: steady-state
    nonlinear TOL: 1.0e-10
    linear TOL: 1.0e-13
    max nonlinear iters: 4
  Postprocess: 
    response type: pointwise
    compute objective: true
    write solution: true
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*(c-targ)^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            #function: thermal_source^2
            weight: 0.0
  Functions:
    xvel: '0.0'
    reaction: 'c*c'
    source: '20.0*(x+0.5)*(1.3-x)'
    #thermal source: 100.0*thermal_source
    #targ: '20.0*(x+0.5)*(1.3-x)'

...
