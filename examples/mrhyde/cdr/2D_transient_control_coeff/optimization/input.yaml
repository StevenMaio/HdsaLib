%YAML 1.1
---
ANONYMOUS:
  verbosity: 0
  debug level: 0
  Mesh:
    dimension: 2
    element type: quad
    xmin: 0.0
    xmax: 1.0
    ymin: 0.0
    ymax: 1.0
    NX: 40
    NY: 40
  Parameters input file: input_params.yaml
  Functions:
    xvel: '20.0'
    yvel: '0.0'
    reaction: '10.0*c*c2'
    reaction2: '10.0*c*c2'
    bubble: '-10.0*(x-0.2)*(x-0.2)- 10.0*(y-0.5)*(y-0.5)'
    source2: 'coef1*(exp(-500.0*(x-0.25)*(x-0.25) -500.0*(y-0.25)*(y-0.25))) + coef2*(exp(-500.0*(x-0.5)*(x-0.5) -500.0*(y-0.25)*(y-0.25))) + coef3*(exp(-500.0*(x-0.75)*(x-0.75) -500.0*(y-0.25)*(y-0.25))) + coef4*(exp(-500.0*(x-0.25)*(x-0.25) -500.0*(y-0.5)*(y-0.5))) + coef5*(exp(-500.0*(x-0.5)*(x-0.5) -500.0*(y-0.5)*(y-0.5))) + coef6*(exp(-500.0*(x-0.75)*(x-0.75) -500.0*(y-0.5)*(y-0.5))) + coef7*(exp(-500.0*(x-0.25)*(x-0.25) -500.0*(y-0.75)*(y-0.75))) + coef8*(exp(-500.0*(x-0.5)*(x-0.5) -500.0*(y-0.75)*(y-0.75))) + coef9*(exp(-500.0*(x-0.75)*(x-0.75) -500.0*(y-0.75)*(y-0.75)))'
  Physics:
    modules: 'cdr, cdr2'
    assemble boundary terms: true
    Initial conditions:
      c: 'exp(bubble)'
      c2: '0.0'
  Discretization:
    order:
      c: 1
      c2: 1
    quadrature: 2
  Solver:
    solver: transient
    workset size: 100
    nonlinear TOL: 1.0e-07
    max nonlinear iters: 10
    final time: 1.0e-1
    number of steps: 10
    use strong DBCs: true
  Analysis input file: input_rol2.yaml
  #Analysis: 
  #  analysis type: forward
  Postprocess:
    write solution: true 
    response type: pointwise
    compute objective: true
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*c^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: source2^2
            weight: 5.0E-7
 
