%YAML 1.1
---
ANONYMOUS:
  verbosity: 2
  debug level: 0
  Mesh: 
    blocknames: block_1
    dimension: 2
    source: Exodus
    mesh file: urbancanyon_2D.e
  Parameters input file: input_params.yaml
  Functions:
    xvel: '0.2'
    yvel: '1.0'
    reaction: '10.0*c*c2'
    #reaction: '0.0'
    reaction2: '10.0*c*c2'
    #reaction2: '0.0'
    bubble: '-0.0001*(x+10.0)*(x+10.0)- 0.0001*(y+330.0)*(y+330.0)'
    diffusion: '2.0'
    diffusion2: '2.0'
    #source2: 'coef1*exp(-0.001*(x+100.0)*(x+100.0) - 0.001*(y+100.0)*(y+100.0))'
    source2: 'coef1*exp(-0.001*(x+100.0)*(x+100.0) - 0.001*(y+100.0)*(y+100.0)) + coef2*exp(-0.001*(x-100.0)*(x-100.0)- 0.001*(y+100.0)*(y+100.0)) + coef3*exp(-0.001*(x+100.0)*(x+100.0)- 0.001*(y-100.0)*(y-100.0)) + coef4*exp(-0.001*(x-100.0)*(x-100.0)- 0.001*(y-100.0)*(y-100.0))'
  Physics:
    modules: 'cdr, cdr2'
    #assemble boundary terms: true
    Initial conditions:
      c: 'exp(bubble)'
      c2: '0.0'
  Dirichlet conditions:
      c:
        left : '0.0'
        front : '0.0'
        right: '0.0'
        buildings : '0.0'
      c2:
        left : '0.0'
        front : '0.0'
        right: '0.0'
        buildings : '0.0'
  Neumann conditions:
      c:
        back: '0.0'
      cdr2:
        back: '0.0'
  Discretization:
    order:
      c: 1
      c2: 1
    quadrature: 2
  Solver:
    solver: transient
    workset size: 100
    nonlinear TOL: 1.0e-07
    max nonlinear iters: 30
    final time: 400.0
    number of steps: 100
    use strong DBCs: true
  #Analysis input file: input_rol2.yaml
  Analysis:
    analysis type: forward
  Postprocess:
    write solution: true 
    response type: pointwise
    compute objective: true
    Objective functions:
      obj0:
        type: integrated control
        function: '(c*exp(-0.001*(x-100.0)*(x-100.0) - 0.001(y-100.0)*(y-100.0)))^2'
        #function: '(c)^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            #function: source2^2
            weight: 5.0E-6
            #weight: 0.0
 
