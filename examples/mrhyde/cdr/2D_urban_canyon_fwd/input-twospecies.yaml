%YAML 1.1
---
ANONYMOUS:
  verbosity: 2
  debug level: 0
  Mesh: 
    blocknames: block_1
    dimension: 2
    source: Exodus
    mesh file: urbancanyon_2D.e
  Parameters input file: input_params.yaml
  Functions:
    xvel: '0.0'
    yvel: '1.0'
    reaction: '100.0*c*c2'
    reaction2: '100.0*c*c2'
    source: 'exp(-0.001*(x-0.0)*(x + 0.0)- 0.001*(y + 330.0)*(y +330.0))'
    diffusion: '0.06'
  Physics:
    modules: 'cdr, cdr2'
  Dirichlet conditions:
      c:
        left : '0.0'
        right :'0.0'
        buildings : '0.0'
      c2:
        left : '0.0'
        right :'0.0'
        buildings : '0.0'
   Neumann conditions:
      c:
        front: '0.0'
        back: '0.0'
      c2:
        front: '0.0'
        back: '0.0'
    Initial conditions:
      c: '0.0'
      c2: '0.0'
  Discretization:
    order:
      c: 1
      c2: 1
    quadrature: 2
  Solver:
    solver: transient
    workset size: 100
    nonlinear TOL: 1.0e-07
    max nonlinear iters: 20
    final time: 10.0
    number of steps: 20
    use strong DBCs: true
  Analysis:
    analysis type: forward
  Postprocess:
    write solution: true 
    response type: pointwise
    compute objective: true
    Objective functions:
      obj0:
        type: integrated control
        function: '0.5*c^2'
        weight: 1.0
        Regularization functions:
          reg0:
            type: integrated
            location: volume
            function: source2^2
            weight: 5.0E-6
 
